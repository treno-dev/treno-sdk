syntax = "proto3";

package steward.provider.v1;

import "google/protobuf/struct.proto";

// The provider contract. Every provider serves ProviderService: it describes itself and, when it declares grants,
// gives access as a whole. A provider that offers credentials serves CredentialService, one that
// has resources also serves ResourceService, and one that runs applications serves ApplicationService. A provider
// offers a call by implementing it. A call it does not offer fails with UNIMPLEMENTED, and Steward
// treats that as not offered. Within v1 the contract is additive only.
//
// Calls that change state are idempotent and return the result of the change, not a report of what
// changed: Steward keeps the state and works out the difference itself. Failures, such as an
// unreachable tool or an invalid request, are returned as gRPC errors.
//
// The file has the messages first, then the services at the bottom.

// ---------------------------------------------------------------------------------------------
// Shared messages
// ---------------------------------------------------------------------------------------------

// A credential is a way of reaching a tool that an organization set up from a kind of credential that a provider offers, such as a role of
// one AWS account. A call that is made on behalf of a credential says which. What the credential holds, its inputs and its secrets, is
// handed to the provider that declared its kind in CredentialService.Resolve, and a task reads the result as its environment.
message Credential {
  // Inputs and secrets belong to a credential kind, and the identity token to its Resolve.
  reserved 1, 2, 6;
  reserved "inputs", "secrets", "identity_token";

  // Who the credential is. A provider can name what it makes in a tool after it, such as a role.
  string ulid = 3;
  string name = 4;

  // The organization the credential belongs to.
  Organization organization = 5;

  // The address of Steward as an issuer of identity tokens: the `iss` of the token, which a cloud is
  // told to trust. A provider that sets up trust in it, such as with a link to a guide, uses this
  // address. It is set in Describe, for the credential the provider is described for.
  string identity_issuer = 7;
}

// An organization of Steward, as a provider is told of it.
message Organization {
  string ulid = 1;
  string name = 2;
}

// Something in the tool that access can be granted to or that can be provisioned.
message Resource {
  // A kind declared in ProviderDefinition.resources.
  string kind = 1;

  // The resource's name in the tool, such as a repository's full name. Steward stores it with the
  // kind and sends it on every later call, which is how a resource is identified.
  string name = 2;

  // Values for the inputs declared in ResourceDefinition.inputs, keyed by input name.
  google.protobuf.Struct inputs = 3;

  // Values for the secrets declared in ResourceDefinition.secrets, keyed by secret name. Resolved
  // by the runner for this call only, like Credential.secrets.
  map<string, string> secrets = 4;

  // Values the resource produced, as declared in ResourceDefinition.outputs, keyed by output name.
  // Set by the provider when it lists a resource; ignored on calls. Provision returns its outputs
  // separately. Values of outputs declared sensitive stay with the runner and are not passed on to
  // Steward.
  google.protobuf.Struct outputs = 5;
}

// Something deployed and run in the tool, as opposed to a resource, which is provisioned.
message Application {
  // A kind declared in ProviderDefinition.applications.
  string kind = 1;

  // The application's identity in the tool.
  string id = 2;

  // Values for the inputs declared in ApplicationDefinition.inputs, keyed by input name.
  google.protobuf.Struct inputs = 3;

  // Values for the secrets declared in ApplicationDefinition.secrets, keyed by secret name.
  map<string, string> secrets = 4;

  // Values the application produced, as declared in ApplicationDefinition.outputs.
  google.protobuf.Struct outputs = 5;

  // What it is deployed from.
  ApplicationSource source = 6;

  // Its variables. Open-ended: the names are not declared by the provider.
  repeated Variable variables = 7;
}

// Where an application is deployed from. The source types are a fixed set that Steward defines, each
// with its own configuration, so every provider sees the same shapes:
//
//   github    { owner, name, branch? }    a GitHub repository
//   registry  { image, tag? }             a container image in a registry
//   s3        { bucket, key }             an archive in an S3 bucket
//   raw       { path }                    a path that is already there
message ApplicationSource {
  // One of ApplicationDefinition.sources.
  string type = 1;

  reserved 2;
  reserved "location";

  // The configuration of that type, as listed above.
  google.protobuf.Struct config = 4;

  // Pins an exact version: a commit, an image digest or an S3 object version id. Empty means the
  // newest of what the config names, such as its branch, tag or key.
  string ref = 3;
}

// One variable of an application, such as an environment variable. Unlike an input, its name is
// chosen by whoever sets it, and each variable carries its own protection.
message Variable {
  string name = 1;

  // For a sensitive variable, resolved by the runner for this call only.
  string value = 2;

  // The value is a secret, such as a key or a token.
  bool sensitive = 3;

  // The value cannot be viewed once it is set.
  bool sealed = 4;

  // The variable cannot be edited or deleted once it is set, such as APP_KEY, where a change would
  // break data the application has already encrypted.
  bool locked = 5;
}

// Who a user is in the tool, such as a GitHub login or an AWS principal.
//
// Every field is optional, so an identity can be as complete as Steward knows it. A call that needs
// more than it was given, such as a grant with neither an external_id nor an attr the tool can
// invite by, fails with INVALID_ARGUMENT.
message Identity {
  // Steward's own opaque identifier for the identity. A provider does not interpret it; it is there
  // to correlate a call with what Steward recorded.
  optional string ulid = 1;

  // The identity in the tool, such as a GitHub login.
  optional string external_id = 2;

  // A display name, when known.
  optional string name = 3;

  // Anything else the tool may need, such as an email address for an invitation.
  google.protobuf.Struct attrs = 4;
}

// A role: one the tool defines itself, or one Steward composed from the permissions the provider
// declares. A call that carries a role always names it. The permissions of a composed role travel
// beside it, in `permissions`.
message Role {
  string name = 1;
}

// One permission, in whatever form the tool uses. The name is the permission itself, such as
// "s3:GetObject", "DescribeStacks" or "pull_requests". The level qualifies it for tools whose
// permissions come in degrees, such as "read" or "write", and is unset for those whose do not.
// Steward does not interpret either; the provider does.
message Permission {
  string name = 1;
  optional string level = 2;

  // What the permission allows, in words. Filled in when a provider returns permissions, and ignored
  // on calls.
  optional string description = 3;
}

// ---------------------------------------------------------------------------------------------
// ProviderService messages
// ---------------------------------------------------------------------------------------------

message DescribeRequest {
  // The credential the provider is being added for, when there is one. Steward sets it when a runner
  // installs a credential, so that the provider can say what the person does in the tool before the
  // settings. Tools that only read the description, such as the generator of docs, leave it empty.
  Credential credential = 1;
}

message DescribeResponse {
  string name = 1;
  string version = 2;

  // What the provider offers. A provider that needs several tools takes a secret for each tool.
  ProviderDefinition definition = 3;

  // Steps the person takes in another tool before the settings of this credential, such as a page
  // that creates a stack. They are for the credential of the request and are kept with it: the
  // definition is the same for every credential of a version of the provider, and these are not.
  // Empty when the request has no credential.
  repeated SetupLink setup_links = 4;
}

// A step to take in another tool, as a link that opens it ready to use.
message SetupLink {
  string title = 1;
  string description = 2;

  // An https address.
  string url = 3;
}

message ProviderDefinition {
  string title = 1;
  string description = 2;

  // A provider has no settings or secrets of its own. They belong to what it offers: each credential, resource and application
  // declares its own inputs and secrets.
  reserved 3, 8;
  reserved "inputs", "secrets";

  // The resource kinds this provider manages. Kinds are unique within the provider.
  repeated ResourceDefinition resources = 4;

  // What can be granted on the provider as a whole is declared as grants. Roles and permissions are not part of the provider.
  reserved 5, 6, 12;
  reserved "permissions", "roles", "grant_inputs";

  // The application kinds this provider can run, such as a Laravel app on a host. Applications are a
  // second kind of thing next to resources: they are deployed from a source and have variables that
  // people edit over time. Kinds are unique within the provider. Empty when the provider runs no
  // applications.
  repeated ApplicationDefinition applications = 7;

  // Providers keep no secrets: they are in vaults, and a credential refers to them.
  reserved 9;
  reserved "secret_engines";

  // The audience of an identity token is declared by the credential kind that takes one.
  reserved 10;
  reserved "identity_audience";

  // The kinds of credential this provider offers, which are the ways it can reach its tool. Empty when the provider offers none, such as one that
  // only reads the environment its tool reads.
  repeated CredentialDefinition credentials = 11;

  // What a person can be given in the tool as a whole, such as access to an AWS account through a role, or membership of a GitHub
  // organization. Names are unique within the provider. Declaring grants is what says the provider supports access.
  repeated GrantDefinition grants = 13;
}

// One setting a provider, a resource or an application takes, declared the way a variable is: a name
// and a type, with the value passed separately, keyed by `name`, in Credential.inputs,
// Resource.inputs or Application.inputs.
message InputDefinition {
  string name = 1;
  string label = 2;
  string description = 3;

  // One of "string", "number", "boolean", "select", "list" (of strings) or "map" (string keys and
  // values). The SDKs export these as constants, and `steward provider validate` rejects any other.
  string type = 4;

  bool required = 5;

  // Used when no value is given.
  google.protobuf.Value default = 6;

  // The choices for a "select".
  repeated string options = 7;

  // For a "number": the least and the greatest value it can have. Left out, there is no limit on that side.
  optional double min = 8;
  optional double max = 9;
}

// One secret a provider, a resource or an application takes, such as an API token or a private
// key. Secrets are separate from inputs: they are stored, sent and shown differently. The value is
// passed in the `secrets` map, keyed by `name`, for one call only, and is never shown back once set.
message SecretDefinition {
  string name = 1;
  string description = 2;
  bool required = 3;
}

// One value a resource produces, declared like an input: a name and a type. Same types as an input.
message OutputDefinition {
  string name = 1;
  string label = 2;
  string description = 3;
  string type = 4;

  // The value is a secret, such as a generated password. The provider still returns it in
  // Resource.outputs, but the runner writes it to the customer's own secret store and reports only
  // a reference to Steward, which never sees or stores the value.
  bool sensitive = 5;
}

message ResourceDefinition {
  // Unique within the provider, such as "repository".
  string kind = 1;
  string title = 2;
  string description = 3;

  // What is required to create a resource of this kind. Provision takes values for these.
  repeated InputDefinition inputs = 4;

  // The secrets a resource of this kind takes, separate from its inputs.
  repeated SecretDefinition secrets = 8;

  // What can be granted on this type. Declaring permissions or roles is what says the type supports
  // access. A tool may expose permissions, roles, or both, as separate lists. Steward lets
  // organizations build their own roles from the permissions.
  repeated PermissionDefinition permissions = 5;
  repeated RoleDefinition roles = 6;

  // What a resource of this kind produces, such as a URL or an ARN, known once it exists. The
  // values come back in Resource.outputs.
  repeated OutputDefinition outputs = 7;
}

// An application is deployable and has open-ended variables, which a resource has neither of. A
// resource has fixed inputs and outputs that the provider declares; an application also has a source
// and variables whose names are chosen by the people who run it. Every declared application kind
// can be deployed and has variables.
message ApplicationDefinition {
  // Unique within the provider, such as "laravel".
  string kind = 1;
  string title = 2;
  string description = 3;

  // Fixed settings of the application itself, such as a runtime or a region. Not its variables.
  repeated InputDefinition inputs = 4;

  // The secrets the application takes, separate from its inputs.
  repeated SecretDefinition secrets = 7;

  // The source types it can be deployed from, by name: "github", "registry", "s3" or "raw", as
  // described on ApplicationSource.
  repeated string sources = 5;

  // What it produces, such as its URL.
  repeated OutputDefinition outputs = 6;
}

// A kind of credential that a provider offers: a way of reaching the tool, such as an AWS role assumed with the identity token of Steward, or
// a pair of access keys. A credential is an instance of a kind. Before a task calls any provider, the runner calls Resolve on the credentials
// shared with the task and hands what they return to the provider as its environment and files, so a provider that only reads the
// environment of its tool needs nothing from the credentials of another provider.
message CredentialDefinition {
  // Unique within the provider, such as "oidc-role".
  string name = 1;
  string title = 2;
  string description = 3;

  // The settings of a credential of this kind, such as the ARN of a role. Not secrets.
  repeated InputDefinition inputs = 4;

  // The secrets of a credential of this kind, such as an access key. A value is a reference to a vault that the runner
  // resolves for the call; it is never kept in the credential.
  repeated SecretDefinition secrets = 5;

  // The audience of the identity token of Steward that the runner sends in CredentialServiceResolveRequest.identity_token, such as
  // `sts.amazonaws.com`. Empty when the kind takes no token.
  string identity_audience = 6;
}

// Something a person can be given in the tool, such as access to an account or a seat. A grant is not always a role: it is whatever
// the provider can give and take away, and it declares the inputs it wants. An input can be free, such as the ARN of a role, or fixed,
// such as a "select" of the roles an organization has.
message GrantDefinition {
  // Unique within the provider, such as "access" or "member".
  string name = 1;
  string title = 2;
  string description = 3;

  // What a grant of this kind asks to know about. The values are sent in the `inputs` of every access call.
  repeated InputDefinition inputs = 4;
}

message PermissionDefinition {
  string name = 1;
  string title = 2;
  string description = 3;

  // The levels the permission can be given at, such as "read" and "write". Empty for a permission
  // that has none.
  repeated string levels = 4;
}

// A role the tool defines itself.
message RoleDefinition {
  string name = 1;
  string title = 2;
  string description = 3;
}

// Access to the provider as a whole, such as a role in an AWS account or membership of a GitHub organization. Steward grants it before
// it grants access to the provider's resources, and decides when to remove it.
//
// Idempotent: granting what is already granted succeeds.
message ProviderServiceGrantAccessRequest {
  reserved 3, 4, 10;
  reserved "role", "permissions", "grant_inputs";

  Credential credential = 1;
  Identity identity = 2;

  // A name declared in ProviderDefinition.grants.
  string grant = 5;

  // The values of the inputs that grant declared, keyed by input name.
  google.protobuf.Struct inputs = 6;
}

message ProviderServiceGrantAccessResponse {
  reserved 2, 4;
  reserved "role", "permissions";

  // The grant's own identity in the tool, such as a membership or invitation id. Empty when the
  // tool has none. Steward records it and sends it back on revoke.
  string id = 1;

  // True when the grant needs the identity to act before it takes effect, such as accepting an
  // invitation. The access is not in effect yet.
  bool pending = 3;
}

// Idempotent: revoking what is already absent succeeds.
message ProviderServiceRevokeAccessRequest {
  reserved 3, 5, 10;
  reserved "role", "permissions", "grant_inputs";

  Credential credential = 1;
  Identity identity = 2;

  // The id GrantAccess returned for this grant, when it returned one.
  string id = 4;

  string grant = 6;
  google.protobuf.Struct inputs = 7;
}

message ProviderServiceRevokeAccessResponse {}

// Asks whether an identity holds a grant now, for example to skip an invitation to someone who
// is already a member, or to find drift.
message ProviderServiceGetAccessRequest {
  reserved 10;
  reserved "grant_inputs";

  Credential credential = 1;
  Identity identity = 2;

  string grant = 3;
  google.protobuf.Struct inputs = 4;
}

message ProviderServiceGetAccessResponse {
  reserved 1, 4;
  reserved "roles", "permissions";

  // True when the identity holds the grant.
  bool granted = 5;

  // True when an invitation or similar is outstanding and the access is not yet in effect.
  bool pending = 2;

  // The identity as the tool knows it, with whatever the tool could resolve, such as the
  // external_id for someone who was found by email. Unset when no match was found.
  Identity identity = 3;
}

// ---------------------------------------------------------------------------------------------
// ResourceService messages
// ---------------------------------------------------------------------------------------------

// Access to one resource, such as a role on a repository. Steward grants it after the identity has
// access to the provider.
//
// Idempotent: granting what is already granted succeeds.
message ResourceServiceGrantAccessRequest {
  Credential credential = 1;
  Resource resource = 2;
  Identity identity = 3;
  Role role = 4;
  repeated Permission permissions = 5;
}

message ResourceServiceGrantAccessResponse {
  // The grant's own identity in the tool, such as an assignment or invitation id. Empty when the
  // tool has none. Steward records it and sends it back on revoke.
  string id = 1;

  // What the tool actually applied. It can differ from what was requested: a composed role may land
  // as a native role, or as only the permissions the tool supports.
  Role role = 2;
  repeated Permission permissions = 4;

  // True when the grant needs the identity to act before it takes effect, such as accepting an
  // invitation. The access is not in effect yet.
  bool pending = 3;
}

// Idempotent: revoking what is already absent succeeds. Steward works out overlap between roles
// before it sends a revoke, so the role here is safe to remove in full.
message ResourceServiceRevokeAccessRequest {
  Credential credential = 1;
  Resource resource = 2;
  Identity identity = 3;
  Role role = 4;
  repeated Permission permissions = 6;

  // The id GrantAccess returned for this grant, when it returned one.
  string id = 5;
}

message ResourceServiceRevokeAccessResponse {}

// Asks what an identity holds on a resource now.
message ResourceServiceGetAccessRequest {
  Credential credential = 1;
  Resource resource = 2;
  Identity identity = 3;
}

message ResourceServiceGetAccessResponse {
  // The roles and permissions the identity holds on the resource. Empty when it has none.
  repeated Role roles = 1;
  repeated Permission permissions = 3;

  // True when an invitation or similar is outstanding and the access is not yet in effect.
  bool pending = 2;
}

// Idempotent: provisioning something that already exists with the same kind and name succeeds, and
// still returns its outputs. Steward works out what changed by comparing the state it stores.
message ResourceServiceProvisionRequest {
  Credential credential = 1;

  // The kind to create, as declared in ProviderDefinition.resources.
  string kind = 2;

  // What to call it in the tool. Steward stores the name with the kind.
  string name = 3;

  // Its inputs, validated against the kind's definition.
  google.protobuf.Struct inputs = 4;

  // Values for the secrets the kind declares, keyed by secret name. Resolved by the runner for this
  // call only.
  map<string, string> secrets = 5;
}

message ResourceServiceProvisionResponse {
  // What the resource produced, as declared in ResourceDefinition.outputs, keyed by output name,
  // such as a URL or an id the tool assigned. Values of outputs declared sensitive stay with the
  // runner and are not passed on to Steward.
  google.protobuf.Struct outputs = 1;
}

// Idempotent: removing something that is already gone succeeds.
message ResourceServiceDeprovisionRequest {
  Credential credential = 1;
  Resource resource = 2;
}

message ResourceServiceDeprovisionResponse {}

message ResourceServiceListRequest {
  Credential credential = 1;
  string kind = 2;
  string page_token = 3;
}

message ResourceServiceListResponse {
  repeated Resource resources = 1;

  // Empty on the last page.
  string next_page_token = 2;
}

// ---------------------------------------------------------------------------------------------
// ApplicationService messages
// ---------------------------------------------------------------------------------------------

// Idempotent: creating an application that already exists with the same identity returns it.
message ApplicationServiceCreateRequest {
  Credential credential = 1;

  // A kind declared in ProviderDefinition.applications, with its inputs and secrets, where it is
  // deployed from, and its starting variables.
  string kind = 2;
  google.protobuf.Struct inputs = 3;
  map<string, string> secrets = 4;
  ApplicationSource source = 5;
  repeated Variable variables = 6;
}

message ApplicationServiceCreateResponse {
  // The application as it now exists, with its identity in the tool.
  Application application = 1;
}

// Idempotent: removing an application that is already gone succeeds.
message ApplicationServiceDestroyRequest {
  Credential credential = 1;
  Application application = 2;
}

message ApplicationServiceDestroyResponse {}

// Deploys the application from a source, replacing what is running. `application.variables` is the
// full set of variables to run it with, so a change to the variables is a deploy: a variable missing
// from it is removed. A locked variable cannot be changed or removed, and the call fails with
// FAILED_PRECONDITION.
message ApplicationServiceDeployRequest {
  Credential credential = 1;
  Application application = 2;
  // What to deploy. Unset means redeploy from the application's current source.
  ApplicationSource source = 3;
}

message ApplicationServiceDeployResponse {
  // The application after the deploy was started, with its outputs.
  Application application = 1;
}

// Turns a credential of a kind into what a tool reads: environment variables and files. The runner calls it before a task
// invokes any provider, once for each credential shared with the task, and merges the results. A value is a secret of the call: the
// provider must not persist it or write it to a log.
message CredentialServiceResolveRequest {
  // The name of a kind declared in ProviderDefinition.credentials.
  string kind = 1;

  // The settings of the credential, keyed by the inputs the kind declared.
  google.protobuf.Struct inputs = 2;

  // The secrets of the credential, keyed by the secrets the kind declared. Resolved by the runner for this call only.
  map<string, string> secrets = 3;

  // A token that proves who the credential is, for the audience the kind declared. Valid for minutes, and never persisted.
  string identity_token = 4;

  // Who the credential is, and the organization it belongs to, so that a provider can name what it makes after them.
  string credential_ulid = 5;
  string credential_name = 6;
  Organization organization = 7;
}

message CredentialServiceResolveResponse {
  // Environment variables for the process of the task, such as AWS_ACCESS_KEY_ID.
  map<string, string> env = 1;

  // Files for the process of the task, which the runner writes into a directory of the task and removes after it. The path of each
  // file is given to the process in the variable named by its env_name.
  repeated CredentialFile files = 2;

  // When the credentials stop working, as seconds since the epoch. 0 when they do not expire. The runner calls Resolve again before
  // then when a task is still running.
  int64 expires_at = 3;
}

message CredentialFile {
  // The name of the environment variable that holds the path of the file, such as AWS_WEB_IDENTITY_TOKEN_FILE.
  string env_name = 1;
  bytes content = 2;
}

// ---------------------------------------------------------------------------------------------
// Services
// ---------------------------------------------------------------------------------------------

// Mandatory for every provider. Describe is always served. GrantAccess, RevokeAccess and
// GetAccess apply only to a provider that declares grants, and answer UNIMPLEMENTED otherwise.
service ProviderService {
  // Describes the provider: the credentials it offers, the resources and applications it manages, and the grants it gives.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // Access to the provider as a whole: giving identities a grant, taking it away, and checking
  // what they hold.
  rpc GrantAccess(ProviderServiceGrantAccessRequest) returns (ProviderServiceGrantAccessResponse);
  rpc RevokeAccess(ProviderServiceRevokeAccessRequest) returns (ProviderServiceRevokeAccessResponse);
  rpc GetAccess(ProviderServiceGetAccessRequest) returns (ProviderServiceGetAccessResponse);
}

// For providers that manage resources. A call a resource kind does not offer answers UNIMPLEMENTED.
// GrantAccess, RevokeAccess and GetAccess are offered by kinds that declare roles or permissions.
service ResourceService {
  rpc GrantAccess(ResourceServiceGrantAccessRequest) returns (ResourceServiceGrantAccessResponse);
  rpc RevokeAccess(ResourceServiceRevokeAccessRequest) returns (ResourceServiceRevokeAccessResponse);
  rpc GetAccess(ResourceServiceGetAccessRequest) returns (ResourceServiceGetAccessResponse);
  rpc Provision(ResourceServiceProvisionRequest) returns (ResourceServiceProvisionResponse);
  rpc Deprovision(ResourceServiceDeprovisionRequest) returns (ResourceServiceDeprovisionResponse);
  rpc List(ResourceServiceListRequest) returns (ResourceServiceListResponse);
}

// For providers that run applications (ProviderDefinition.applications): deployable things with a source
// and open-ended variables.
service ApplicationService {
  rpc Create(ApplicationServiceCreateRequest) returns (ApplicationServiceCreateResponse);
  rpc Destroy(ApplicationServiceDestroyRequest) returns (ApplicationServiceDestroyResponse);
  rpc Deploy(ApplicationServiceDeployRequest) returns (ApplicationServiceDeployResponse);
}

// For providers that offer ways to reach a tool (ProviderDefinition.credentials).
service CredentialService {
  rpc Resolve(CredentialServiceResolveRequest) returns (CredentialServiceResolveResponse);
}
