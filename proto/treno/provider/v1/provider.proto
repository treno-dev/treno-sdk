syntax = "proto3";

package treno.provider.v1;

import "google/protobuf/struct.proto";

// The provider contract. Every provider serves ProviderService: it describes itself and, when it declares entitlements,
// gives access as a whole. A provider that has services also serves ServiceService, and one that
// runs applications serves ApplicationService. A provider
// offers a call by implementing it. A call it does not offer fails with UNIMPLEMENTED, and Treno
// treats that as not offered. Within v1 the contract is additive only.
//
// Calls that change state are idempotent and return the result of the change, not a report of what
// changed: Treno keeps the state and works out the difference itself. Failures, such as an
// unreachable tool or an invalid request, are returned as gRPC errors.
//
// The file has the messages first, then the services at the bottom.

// ---------------------------------------------------------------------------------------------
// Shared messages
// ---------------------------------------------------------------------------------------------

// A credential is a set of variables that an organization set up to reach a tool. A call that is made on behalf of a credential says
// which. The runner gives a task the variables of its credentials as environment variables, so the provider is told who the
// credential is and holds none of its values.
message Credential {
  reserved 1, 2, 6;
  reserved "inputs", "secrets", "identity_token";

  // Who the credential is. A provider can name what it makes in a tool after it, such as a role.
  string ulid = 3;
  string name = 4;

  // The organization the credential belongs to.
  Organization organization = 5;

  // The address of Treno as an issuer of identity tokens: the `iss` of the token, which a cloud is
  // told to trust. A provider that sets up trust in it, such as with a link to a guide, uses this
  // address. It is set in Describe, for the credential the provider is described for.
  string identity_issuer = 7;
}

// An organization of Treno, as a provider is told of it.
message Organization {
  string ulid = 1;
  string name = 2;
}

// Something in the tool that access can be granted to or that can be provisioned.
message Service {
  // A kind declared in ProviderDefinition.services.
  string kind = 1;

  // The service's name in the tool, such as a repository's full name. Treno stores it with the
  // kind and sends it on every later call, which is how a service is identified.
  string name = 2;

  // Values for the inputs declared in ServiceDefinition.inputs, keyed by input name.
  google.protobuf.Struct inputs = 3;

  // Values for the secrets declared in ServiceDefinition.secrets, keyed by secret name. Resolved
  // by the runner for this call only.
  map<string, string> secrets = 4;

  // Values the service produced, as declared in ServiceDefinition.outputs, keyed by output name.
  // Set by the provider when it lists a service; ignored on calls. Provision returns its outputs
  // separately. Values of outputs declared sensitive stay with the runner and are not passed on to
  // Treno.
  google.protobuf.Struct outputs = 5;

  // Its variables, when the kind takes them (ServiceDefinition.variables).
  repeated Variable variables = 6;
}

// Says that a kind takes variables: name and value pairs, of any number, that whoever sets up a service
// adds to it, such as the variables of a Terraform workspace. Unlike an input, the names are not
// declared, and Treno keeps the variables apart from the inputs, since they are handled in ways that
// inputs are not.
message VariadicVariables {
  // What the variables are for, said where they are set.
  string description = 1;
}

// Something deployed and run in the tool, as opposed to a service, which is provisioned.
message Application {
  // A kind declared in ProviderDefinition.applications.
  string kind = 1;

  // The application's identity in the tool.
  string id = 2;

  // Values for the inputs declared in ApplicationDefinition.inputs, keyed by input name.
  google.protobuf.Struct inputs = 3;

  // Values for the secrets declared in ApplicationDefinition.secrets, keyed by secret name.
  map<string, string> secrets = 4;

  // Values the application produced, as declared in ApplicationDefinition.outputs.
  google.protobuf.Struct outputs = 5;

  // What it is deployed from.
  ApplicationSource source = 6;

  // Its variables. Open-ended: the names are not declared by the provider.
  repeated Variable variables = 7;
}

// Where an application is deployed from. The source types are a fixed set that Treno defines, each
// with its own configuration, so every provider sees the same shapes:
//
//   github    { owner, name, branch? }    a GitHub repository
//   registry  { image, tag? }             a container image in a registry
//   s3        { bucket, key }             an archive in an S3 bucket
//   raw       { path }                    a path that is already there
message ApplicationSource {
  // One of ApplicationDefinition.sources.
  string type = 1;

  reserved 2;
  reserved "location";

  // The configuration of that type, as listed above.
  google.protobuf.Struct config = 4;

  // Pins an exact version: a commit, an image digest or an S3 object version id. Empty means the
  // newest of what the config names, such as its branch, tag or key.
  string ref = 3;
}

// One variable of an application, such as an environment variable. Unlike an input, its name is
// chosen by whoever sets it, and each variable carries its own protection.
message Variable {
  string name = 1;

  // For a sensitive variable, resolved by the runner for this call only.
  string value = 2;

  // The value is a secret, such as a key or a token.
  bool sensitive = 3;

  // The value cannot be viewed once it is set.
  bool sealed = 4;

  // The variable cannot be edited or deleted once it is set, such as APP_KEY, where a change would
  // break data the application has already encrypted.
  bool locked = 5;
}

// Who a user is in the tool, such as a GitHub login or an AWS principal.
//
// Every field is optional, so an identity can be as complete as Treno knows it. A call that needs
// more than it was given, such as an entitlement with neither an external_id nor an attr the tool can
// invite by, fails with INVALID_ARGUMENT.
message Identity {
  // Treno's own opaque identifier for the identity. A provider does not interpret it; it is there
  // to correlate a call with what Treno recorded.
  optional string ulid = 1;

  // The identity in the tool, such as a GitHub login.
  optional string external_id = 2;

  // A display name, when known.
  optional string name = 3;

  // Anything else the tool may need, such as an email address for an invitation.
  google.protobuf.Struct attrs = 4;
}

// A role: one the tool defines itself, or one Treno composed from the permissions the provider
// declares. A call that carries a role always names it. The permissions of a composed role travel
// beside it, in `permissions`.
message Role {
  string name = 1;
}

// One permission, in whatever form the tool uses. The name is the permission itself, such as
// "s3:GetObject", "DescribeStacks" or "pull_requests". The level qualifies it for tools whose
// permissions come in degrees, such as "read" or "write", and is unset for those whose do not.
// Treno does not interpret either; the provider does.
message Permission {
  string name = 1;
  optional string level = 2;

  // What the permission allows, in words. Filled in when a provider returns permissions, and ignored
  // on calls.
  optional string description = 3;
}

// ---------------------------------------------------------------------------------------------
// ProviderService messages
// ---------------------------------------------------------------------------------------------

message DescribeRequest {
  // The credential the provider is being added for, when there is one. Treno sets it when a runner
  // installs a credential, so that the provider can say what the person does in the tool before the
  // settings. Tools that only read the description, such as the generator of docs, leave it empty.
  Credential credential = 1;
}

message DescribeResponse {
  string name = 1;
  string version = 2;

  // What the provider offers. A provider that needs several tools takes a secret for each tool.
  ProviderDefinition definition = 3;

  // Steps the person takes in another tool before the settings of this credential, such as a page
  // that creates a stack. They are for the credential of the request and are kept with it: the
  // definition is the same for every credential of a version of the provider, and these are not.
  // Empty when the request has no credential.
  repeated SetupLink setup_links = 4;
}

// A step to take in another tool, as a link that opens it ready to use.
message SetupLink {
  string title = 1;
  string description = 2;

  // An https address.
  string url = 3;
}

message ProviderDefinition {
  string title = 1;
  string description = 2;

  // A provider has no settings or secrets of its own. They belong to what it offers: each service and application declares its own
  // inputs and secrets.
  reserved 3, 8;
  reserved "inputs", "secrets";

  // The service kinds this provider manages. Kinds are unique within the provider.
  repeated ServiceDefinition services = 4;

  // What can be granted on the provider as a whole is declared as entitlements. Roles and permissions are not part of the provider.
  reserved 5, 6, 12;
  reserved "permissions", "roles", "grant_inputs";

  // The application kinds this provider can run, such as a Laravel app on a host. Applications are a
  // second kind of thing next to services: they are deployed from a source and have variables that
  // people edit over time. Kinds are unique within the provider. Empty when the provider runs no
  // applications.
  repeated ApplicationDefinition applications = 7;

  // Providers keep no secrets: they are in secret stores.
  reserved 9;
  reserved "secret_engines";

  // The audience of an identity token is asked for by the task that takes one.
  reserved 10;
  reserved "identity_audience";

  // Credentials are variables of an organization, and a provider does not declare them.
  reserved 11;
  reserved "credentials";

  // What a person can be given in the tool as a whole, such as access to an AWS account through a role, or membership of a GitHub
  // organization. Names are unique within the provider. Declaring entitlements is what says the provider supports access.
  repeated EntitlementDefinition entitlements = 13;
}

// One setting a provider, a service or an application takes, declared the way a variable is: a name
// and a type, with the value passed separately, keyed by `name`, in Service.inputs or
// Application.inputs.
message InputDefinition {
  string name = 1;
  string label = 2;
  string description = 3;

  // One of "string", "number", "boolean", "select", "list" (of strings), "map" (string keys and
  // values) or a type of Treno's own, named `treno::<name>`: "treno::source", where something is
  // fetched from as `{ type, config }`, whose `options` are the source types it accepts, and
  // "map(string)", names and values asked for as a list of rows, and "treno::json", any JSON value,
  // asked for in a dialog that checks it. The SDKs export these
  // as constants, and `treno provider validate` rejects any other.
  string type = 4;

  bool required = 5;

  // Used when no value is given.
  google.protobuf.Value default = 6;

  // The choices for a "select", and the source types a "treno::source" accepts.
  repeated string options = 7;

  // For a "number": the least and the greatest value it can have. Left out, there is no limit on that side.
  optional double min = 8;
  optional double max = 9;
}

// One secret a provider, a service or an application takes, such as an API token or a private
// key. Secrets are separate from inputs: they are stored, sent and shown differently. The value is
// passed in the `secrets` map, keyed by `name`, for one call only, and is never shown back once set.
message SecretDefinition {
  string name = 1;
  string description = 2;
  bool required = 3;
}

// One value a service produces, declared like an input: a name and a type. Same types as an input.
message OutputDefinition {
  string name = 1;
  string label = 2;
  string description = 3;
  string type = 4;

  // The value is a secret, such as a generated password. The provider still returns it in
  // Service.outputs, but the runner writes it to the customer's own secret store and reports only
  // a reference to Treno, which never sees or stores the value.
  bool sensitive = 5;
}

message ServiceDefinition {
  // Unique within the provider, such as "repository".
  string kind = 1;
  string title = 2;
  string description = 3;

  // What is required to create a service of this kind. Provision takes values for these.
  repeated InputDefinition inputs = 4;

  // The secrets a service of this kind takes, separate from its inputs.
  repeated SecretDefinition secrets = 8;

  // What can be granted on this type. Declaring permissions or roles is what says the type supports
  // access. A tool may expose permissions, roles, or both, as separate lists. Treno lets
  // organizations build their own roles from the permissions.
  repeated PermissionDefinition permissions = 5;
  repeated RoleDefinition roles = 6;

  // What a service of this kind produces, such as a URL or an ARN, known once it exists. The
  // values come back in Service.outputs.
  repeated OutputDefinition outputs = 7;

  // Set when the kind takes variables, which the people who set up a service add to it by name.
  // Provision and the other calls receive them in `variables`.
  VariadicVariables variables = 9;
}

// An application is deployable and has open-ended variables, which a service has neither of. A
// service has fixed inputs and outputs that the provider declares; an application also has a source
// and variables whose names are chosen by the people who run it. Every declared application kind
// can be deployed and has variables.
message ApplicationDefinition {
  // Unique within the provider, such as "laravel".
  string kind = 1;
  string title = 2;
  string description = 3;

  // Fixed settings of the application itself, such as a runtime or a region. Not its variables.
  repeated InputDefinition inputs = 4;

  // The secrets the application takes, separate from its inputs.
  repeated SecretDefinition secrets = 7;

  // The source types it can be deployed from, by name: "github", "registry", "s3" or "raw", as
  // described on ApplicationSource.
  repeated string sources = 5;

  // What it produces, such as its URL.
  repeated OutputDefinition outputs = 6;
}

// Something a person can be given in the tool, such as access to an account or a seat. An entitlement is not always a role: it is whatever
// the provider can give and take away, and it declares the inputs it wants. An input can be free, such as the ARN of a role, or fixed,
// such as a "select" of the roles an organization has.
message EntitlementDefinition {
  // Unique within the provider, such as "access" or "member".
  string name = 1;
  string title = 2;
  string description = 3;

  // What an entitlement of this kind asks to know about. The values are sent in the `inputs` of every access call.
  repeated InputDefinition inputs = 4;
}

message PermissionDefinition {
  string name = 1;
  string title = 2;
  string description = 3;

  // The levels the permission can be given at, such as "read" and "write". Empty for a permission
  // that has none.
  repeated string levels = 4;
}

// A role the tool defines itself.
message RoleDefinition {
  string name = 1;
  string title = 2;
  string description = 3;
}

// Access to the provider as a whole, such as a role in an AWS account or membership of a GitHub organization. Treno grants it before
// it grants access to the provider's services, and decides when to remove it.
//
// Idempotent: granting what is already granted succeeds.
message ProviderServiceGrantAccessRequest {
  reserved 3, 4, 10;
  reserved "role", "permissions", "grant_inputs";

  Credential credential = 1;
  Identity identity = 2;

  // A name declared in ProviderDefinition.entitlements.
  string entitlement = 5;

  // The values of the inputs that entitlement declared, keyed by input name.
  google.protobuf.Struct inputs = 6;
}

message ProviderServiceGrantAccessResponse {
  reserved 2, 4;
  reserved "role", "permissions";

  // The entitlement's own identity in the tool, such as a membership or invitation id. Empty when the
  // tool has none. Treno records it and sends it back on revoke.
  string id = 1;

  // True when the entitlement needs the identity to act before it takes effect, such as accepting an
  // invitation. The access is not in effect yet.
  bool pending = 3;
}

// Idempotent: revoking what is already absent succeeds.
message ProviderServiceRevokeAccessRequest {
  reserved 3, 5, 10;
  reserved "role", "permissions", "grant_inputs";

  Credential credential = 1;
  Identity identity = 2;

  // The id GrantAccess returned for this grant, when it returned one.
  string id = 4;

  string entitlement = 6;
  google.protobuf.Struct inputs = 7;
}

message ProviderServiceRevokeAccessResponse {}

// Asks whether an identity holds an entitlement now, for example to skip an invitation to someone who
// is already a member, or to find drift.
message ProviderServiceGetAccessRequest {
  reserved 10;
  reserved "grant_inputs";

  Credential credential = 1;
  Identity identity = 2;

  string entitlement = 3;
  google.protobuf.Struct inputs = 4;
}

message ProviderServiceGetAccessResponse {
  reserved 1, 4;
  reserved "roles", "permissions";

  // True when the identity holds the entitlement.
  bool granted = 5;

  // True when an invitation or similar is outstanding and the access is not yet in effect.
  bool pending = 2;

  // The identity as the tool knows it, with whatever the tool could resolve, such as the
  // external_id for someone who was found by email. Unset when no match was found.
  Identity identity = 3;
}

// ---------------------------------------------------------------------------------------------
// ServiceService messages
// ---------------------------------------------------------------------------------------------

// Access to one service, such as a role on a repository. Treno grants it after the identity has
// access to the provider.
//
// Idempotent: granting what is already granted succeeds.
message ServiceServiceGrantAccessRequest {
  Credential credential = 1;
  Service service = 2;
  Identity identity = 3;
  Role role = 4;
  repeated Permission permissions = 5;
}

message ServiceServiceGrantAccessResponse {
  // The entitlement's own identity in the tool, such as an assignment or invitation id. Empty when the
  // tool has none. Treno records it and sends it back on revoke.
  string id = 1;

  // What the tool actually applied. It can differ from what was requested: a composed role may land
  // as a native role, or as only the permissions the tool supports.
  Role role = 2;
  repeated Permission permissions = 4;

  // True when the entitlement needs the identity to act before it takes effect, such as accepting an
  // invitation. The access is not in effect yet.
  bool pending = 3;
}

// Idempotent: revoking what is already absent succeeds. Treno works out overlap between roles
// before it sends a revoke, so the role here is safe to remove in full.
message ServiceServiceRevokeAccessRequest {
  Credential credential = 1;
  Service service = 2;
  Identity identity = 3;
  Role role = 4;
  repeated Permission permissions = 6;

  // The id GrantAccess returned for this grant, when it returned one.
  string id = 5;
}

message ServiceServiceRevokeAccessResponse {}

// Asks what an identity holds on a service now.
message ServiceServiceGetAccessRequest {
  Credential credential = 1;
  Service service = 2;
  Identity identity = 3;
}

message ServiceServiceGetAccessResponse {
  // The roles and permissions the identity holds on the service. Empty when it has none.
  repeated Role roles = 1;
  repeated Permission permissions = 3;

  // True when an invitation or similar is outstanding and the access is not yet in effect.
  bool pending = 2;
}

// Idempotent: provisioning something that already exists with the same kind and name succeeds, and
// still returns its outputs. Treno works out what changed by comparing the state it stores.
message ServiceServiceProvisionRequest {
  Credential credential = 1;

  // The kind to create, as declared in ProviderDefinition.services.
  string kind = 2;

  // What to call it in the tool. Treno stores the name with the kind.
  string name = 3;

  // Its inputs, validated against the kind's definition.
  google.protobuf.Struct inputs = 4;

  // Values for the secrets the kind declares, keyed by secret name. Resolved by the runner for this
  // call only.
  map<string, string> secrets = 5;

  // Its variables, when the kind takes them.
  repeated Variable variables = 6;
}

message ServiceServiceProvisionResponse {
  // What the service produced, as declared in ServiceDefinition.outputs, keyed by output name,
  // such as a URL or an id the tool assigned. Values of outputs declared sensitive stay with the
  // runner and are not passed on to Treno.
  google.protobuf.Struct outputs = 1;
}

// Idempotent: removing something that is already gone succeeds.
message ServiceServiceDeprovisionRequest {
  Credential credential = 1;
  Service service = 2;
}

message ServiceServiceDeprovisionResponse {}

message ServiceServiceListRequest {
  Credential credential = 1;
  string kind = 2;
  string page_token = 3;
}

message ServiceServiceListResponse {
  repeated Service services = 1;

  // Empty on the last page.
  string next_page_token = 2;
}

// ---------------------------------------------------------------------------------------------
// ApplicationService messages
// ---------------------------------------------------------------------------------------------

// Idempotent: creating an application that already exists with the same identity returns it.
message ApplicationServiceCreateRequest {
  Credential credential = 1;

  // A kind declared in ProviderDefinition.applications, with its inputs and secrets, where it is
  // deployed from, and its starting variables.
  string kind = 2;
  google.protobuf.Struct inputs = 3;
  map<string, string> secrets = 4;
  ApplicationSource source = 5;
  repeated Variable variables = 6;
}

message ApplicationServiceCreateResponse {
  // The application as it now exists, with its identity in the tool.
  Application application = 1;
}

// Idempotent: removing an application that is already gone succeeds.
message ApplicationServiceDestroyRequest {
  Credential credential = 1;
  Application application = 2;
}

message ApplicationServiceDestroyResponse {}

// Deploys the application from a source, replacing what is running. `application.variables` is the
// full set of variables to run it with, so a change to the variables is a deploy: a variable missing
// from it is removed. A locked variable cannot be changed or removed, and the call fails with
// FAILED_PRECONDITION.
message ApplicationServiceDeployRequest {
  Credential credential = 1;
  Application application = 2;
  // What to deploy. Unset means redeploy from the application's current source.
  ApplicationSource source = 3;
}

message ApplicationServiceDeployResponse {
  // The application after the deploy was started, with its outputs.
  Application application = 1;
}

// ---------------------------------------------------------------------------------------------
// Services
// ---------------------------------------------------------------------------------------------

// Mandatory for every provider. Describe is always served. GrantAccess, RevokeAccess and
// GetAccess apply only to a provider that declares entitlements, and answer UNIMPLEMENTED otherwise.
service ProviderService {
  // Describes the provider: the services and applications it manages, and the entitlements it gives.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // Access to the provider as a whole: giving identities an entitlement, taking it away, and checking
  // what they hold.
  rpc GrantAccess(ProviderServiceGrantAccessRequest) returns (ProviderServiceGrantAccessResponse);
  rpc RevokeAccess(ProviderServiceRevokeAccessRequest) returns (ProviderServiceRevokeAccessResponse);
  rpc GetAccess(ProviderServiceGetAccessRequest) returns (ProviderServiceGetAccessResponse);
}

// For providers that manage services. A call a service kind does not offer answers UNIMPLEMENTED.
// GrantAccess, RevokeAccess and GetAccess are offered by kinds that declare roles or permissions.
service ServiceService {
  rpc GrantAccess(ServiceServiceGrantAccessRequest) returns (ServiceServiceGrantAccessResponse);
  rpc RevokeAccess(ServiceServiceRevokeAccessRequest) returns (ServiceServiceRevokeAccessResponse);
  rpc GetAccess(ServiceServiceGetAccessRequest) returns (ServiceServiceGetAccessResponse);
  rpc Provision(ServiceServiceProvisionRequest) returns (ServiceServiceProvisionResponse);
  rpc Deprovision(ServiceServiceDeprovisionRequest) returns (ServiceServiceDeprovisionResponse);
  rpc List(ServiceServiceListRequest) returns (ServiceServiceListResponse);
}

// For providers that run applications (ProviderDefinition.applications): deployable things with a source
// and open-ended variables.
service ApplicationService {
  rpc Create(ApplicationServiceCreateRequest) returns (ApplicationServiceCreateResponse);
  rpc Destroy(ApplicationServiceDestroyRequest) returns (ApplicationServiceDestroyResponse);
  rpc Deploy(ApplicationServiceDeployRequest) returns (ApplicationServiceDeployResponse);
}
